
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codelearn Academy Dashboard</title>
</head>
<body>
  <h1>Codelearn Academy</h1>
  <h2>Private Admin Sign In</h2>

  <form id="loginForm">
    <label>Email address</label><br>
    <input type="email" id="email" required><br><br>

    <label>Password</label><br>
    <input type="password" id="password" required><br><br>

    <button type="submit">Sign in</button>
  </form>

  <p id="message"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = window.supabase.createClient(
      "https://nfccdikqvjybkrkgrodm.supabase.co",
      "sb_publishable_-Oj2zdc2R55oCzwqQuDFPg_OSj0WsqA"
    );

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      message.textContent = "Signing in...";

      const { error } = await db.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      });

      if (error) {
        message.textContent =
          "Sign-in failed. Check your email, password, and email confirmation.";
        return;
      }

      window.location.href = "registrations.html";
    });
  </script>
</body>
</html>
