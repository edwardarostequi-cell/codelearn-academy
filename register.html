

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codelearn Academy Registration</title>
</head>
<body>
  <h1>Codelearn Academy</h1>
  <h2>Create your account</h2>

  <form>
    <label for="name">Full name:</label><br>
    <input type="text" id="name" name="name" required><br><br>

    <label for="email">Email address:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <label for="phone">Phone number (optional):</label><br>
    <input type="tel" id="phone" name="phone"><br><br>

    <button type="submit">Register</button>
  </form>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
  <script>
  const supabaseClient = window.supabase.createClient(
    "https://nfccdikqvjybkrkgrodm.supabase.co",
    "sb_publishable_-Oj2zdc2R55oCzwqQuDFPg_OSj0WsqA"
  );

  document.querySelector("form").addEventListener("submit", async function(event) {
    event.preventDefault();

    const form = event.target;
    const registration = {
      full_name: form.elements["name"].value,
      email: form.elements["email"].value,
      phone: form.elements["phone"].value || null
    };

    const { error } = await supabaseClient
      .from("registrations")
      .insert([registration]);

    if (error) {
      alert("Registration failed. Please try again.");
    } else {
      alert("Registration successful!");
      form.reset();
    }
  });
  </script>
</html>
